<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=block">
<style>
html,body{margin:0;width:2560px;height:1440px;overflow:hidden;background:#0b0b1e;font-family:Inter,system-ui,sans-serif}
.b{position:absolute;border-radius:50%;filter:blur(140px)}
.v{width:1300px;height:1000px;background:#7a3cff;left:250px;top:180px;opacity:.55}
.t{width:1100px;height:900px;background:#1fb8b0;right:180px;top:420px;opacity:.38}
.m{width:900px;height:700px;background:#e0409f;left:1050px;top:820px;opacity:.28}
.i{width:900px;height:700px;background:#3a4dff;left:1300px;top:0;opacity:.35}
.echo{position:absolute;left:50%;top:50%;width:2300px;transform:translate(-50%,-50%);opacity:.06}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:center;gap:64px}
.mark{width:300px;height:191px;filter:drop-shadow(0 18px 30px rgba(10,6,40,.55))}
.txt{display:grid;gap:14px;color:#f4f5ff}
.name{font-weight:700;font-size:168px;letter-spacing:-.035em;line-height:1}
.tag{font-weight:500;font-size:46px;letter-spacing:-.01em;color:rgba(232,234,255,.72)}
.tag b{color:#64d2ff;font-weight:500}
</style></head><body>
<div class="b v"></div><div class="b i"></div><div class="b t"></div><div class="b m"></div>
<svg class="echo" viewBox="6 22 88 56"><path d="M55.05 44.48C66.21 35.55 85 35.55 85 50C85 67 59 64 50 50L33 32L15 50L33 68L44.85 55.45" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg>
<div class="safe">
<svg class="mark" viewBox="6 22 88 56">
<defs>
<path id="s" d="M55.05 44.48C66.21 35.55 85 35.55 85 50C85 67 59 64 50 50L33 32L15 50L33 68L44.85 55.45" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ee8f5" stop-opacity=".96"/><stop offset=".5" stop-color="#5b6cff" stop-opacity=".9"/><stop offset="1" stop-color="#a45cff" stop-opacity=".92"/></linearGradient>
<linearGradient id="h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".38" stop-color="#fff" stop-opacity=".04"/><stop offset=".75" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".28"/></linearGradient>
<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><use href="#s"/></mask>
<filter id="r" x="-10%" y="-10%" width="120%" height="120%"><feMorphology in="SourceAlpha" operator="erode" radius="1.4" result="i"/><feComposite in="SourceAlpha" in2="i" operator="out" result="e"/><feGaussianBlur in="e" stdDeviation=".35" result="b"/><feFlood flood-color="#fff" flood-opacity=".8"/><feComposite in2="b" operator="in"/></filter>
</defs>
<rect x="0" y="20" width="100" height="60" fill="url(#g)" mask="url(#m)"/>
<rect x="0" y="20" width="100" height="60" fill="url(#h)" mask="url(#m)"/>
<use href="#s" filter="url(#r)"/>
</svg>
<div class="txt"><div class="name">Ziginity</div><div class="tag">Every game, <b>one twist</b> nobody saw coming.</div></div>
</div>
</body></html>
